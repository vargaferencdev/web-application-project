spring:
  application:
    name: anitrack
  datasource:
    url: jdbc:postgresql://localhost:5432/anitrack
    username: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 60
    cookie-name: anitrack_token
    cookie-secure: false